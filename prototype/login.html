<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Dues Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="school-logo.jpg" alt="School of Sciences" class="auth-logo">
      <h1>Dues Management System</h1>
      <p class="subtitle">School of Sciences, UENR Sunyani</p>
      <form onsubmit="event.preventDefault();navigateTo('dashboard.html')">
        <div class="field">
          <label>Email Address</label>
          <input type="email" class="input" placeholder="admin@sciences.uenr.edu.gh" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" class="input" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">Sign In</button>
      </form>
      <p class="text-xs muted text-center mt-md">Admin access only. Class reps use the class page link.</p>
    </div>
  </div>
  <script src="nav.js"></script>
</body>
</html>
