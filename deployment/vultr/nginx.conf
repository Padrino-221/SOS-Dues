# ═══════════════════════════════════════════════════════════════════
# Dues Management — Nginx reverse proxy (Vultr VPS)
# Place at:  /etc/nginx/sites-available/dues
# Enable:    ln -s /etc/nginx/sites-available/dues /etc/nginx/sites-enabled/
# Test:      nginx -t && systemctl reload nginx
#
# Serves the built SPA (client/dist) and proxies /api/* + /socket.io/* to
# the Express API on 127.0.0.1:3001. The client is built with a relative
# baseURL ('/api'), so everything is same-origin — no CORS in production.
#
# ── HTTPS / Certbot ────────────────────────────────────────────────
# This template is INTENTIONALLY HTTP-only so certbot can generate TLS
# cleanly on a fresh box. Run certbot AFTER the HTTP block works:
#   certbot --nginx -d dues.sosuenr.com
# certbot rewrites this file to add the :443 `ssl_certificate` lines and a
# separate HTTP→HTTPS 301 redirect server block. Those additions are
# machine-specific (they point at /etc/letsencrypt/live/<domain>/…), so they
# are NOT duplicated here on purpose — never overwrite a live conf that
# certbot has already annotated with this bare template.
# ═══════════════════════════════════════════════════════════════════

upstream dues_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name dues.sosuenr.com;

    # ── Security headers ──────────────────────────────────────────
    # NOTE: nginx DROPS the whole server-level add_header list for any
    # location that declares its own add_header, so every header below is
    # repeated inside location /assets/ (the hashed JS/CSS) — otherwise those
    # responses would ship without nosniff/HSTS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: harmless on the pre-certbot HTTP block (browsers ignore it over
    # plain HTTP) and correct once certbot terminates TLS on this server.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP for the built SPA. Verified against client/: scripts and fonts are
    # self-hosted (/assets, /fonts/*.woff2) — the only external origin the app
    # may ever touch is Google Fonts (allowed for safety; nothing loads it today).
    #  - style-src needs 'unsafe-inline' because pages set style={{…}} attributes
    #  - img-src needs data: for the inline SVG search icon
    #  - connect-src 'self' covers /api and the socket.io websocket (same origin)
    #  - object-src 'none' / frame-ancestors 'none' / base-uri 'self' /
    #    form-action 'self' close the usual injection and framing holes
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;

    # ── Frontend (Vite build output) ──────────────────────────────
    root /opt/dues/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── index.html must never be cached ───────────────────────────
    # A new deploy changes only the hashed asset filenames referenced from
    # index.html. If a browser (or a proxy) caches index.html it keeps
    # pointing at the OLD bundle and the deploy looks like it "didn't
    # happen". no-cache forces a revalidation on every load.
    # Only Cache-Control is set here on purpose: declaring any add_header in
    # this block would DROP the inherited server-level header list, and
    # X-Content-Type-Options/nosniff already reaches index.html via
    # `location /` above.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ── Cache hashed static assets ────────────────────────────────
    location /assets/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://dues_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        client_max_body_size 10m;
    }

    # ── Socket.io (real-time admin updates) — WebSocket upgrade ──
    location /socket.io/ {
        proxy_pass http://dues_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Block dotfiles ────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
